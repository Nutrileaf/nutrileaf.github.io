<!doctype html>
<html lang="en">
<head>
<script type="module" src="ga4-bootstrap.js"></script>

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nutrileaf Product</title>
<meta name="description" id="productMetaDescription" content="View product details from the Nutrileaf collection.">
<link rel="canonical" id="productCanonical" href="https://nutrileaf.github.io/product.html">
<link rel="stylesheet" href="styles.css">
<style>
.product-detail-page{min-height:100vh;background:#faf8f2;color:var(--green)}
.product-detail-wrap{max-width:1120px;margin:0 auto;padding:70px 24px}
.product-back{display:inline-block;margin-bottom:32px;color:var(--green);text-decoration:none;font:15px Georgia,serif}
.product-detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:70px;align-items:center;background:#fff;border:1px solid var(--line);padding:36px}
.product-detail-image{min-height:520px;background:linear-gradient(135deg,#edf0e8,#d7e1d1);display:grid;place-items:center}
.product-detail-image img{width:100%;height:100%;max-height:520px;object-fit:contain;padding:20px;box-sizing:border-box}
.product-detail-symbol{font:110px Georgia;color:var(--green)}
.product-detail-tag{display:block;color:#b86d38;letter-spacing:2px;text-transform:uppercase;font-size:12px;margin-bottom:12px}
.product-detail h1{font:46px Georgia,serif;line-height:1.05;margin:0 0 20px}
.product-detail-description{font-size:17px;line-height:1.7;color:#56655c;margin-bottom:28px}
.product-detail-price{font-size:25px;font-weight:700;margin-bottom:24px}
.detail-launch{display:inline-block;width:100%;max-width:300px;padding:14px 20px;border:0;border-radius:999px;background:#edf0e8;color:var(--green);font-weight:700;font-size:16px;text-align:center;box-sizing:border-box}
.detail-note{margin-top:18px;font-size:13px;color:#718077}
@media(max-width:800px){.product-detail{grid-template-columns:1fr;gap:35px;padding:22px}.product-detail-image{min-height:360px}.product-detail h1{font-size:36px}.product-detail-wrap{padding:40px 18px}}
</style>
</head>
<body>
<main class="product-detail-page">
<div class="product-detail-wrap">
<a class="product-back" href="index.html#shop">← Back to collection</a>
<section class="product-detail" id="productDetail" aria-live="polite"></section>
</div>
</main>
<script type="module" src="p27-catalog-launch.js"></script>
<script type="module" src="script.js"></script>
<script type="module">
import { trackViewItem } from "./analytics.js";
await window.nutrileafCatalogReady;
const id=new URLSearchParams(location.search).get("id");
const product=window.nutrileafProducts.find(p=>String(p.id)===id);
const detail=document.querySelector("#productDetail");
if(!product){
  detail.innerHTML="<div><h1>Product not found</h1><p>The product you're looking for is not available.</p></div>";
}else{
  document.title=`${product.name} | Nutrileaf`;
  const metaDescription=document.querySelector('#productMetaDescription');
  if(metaDescription)metaDescription.content=product.desc||`View ${product.name} from the Nutrileaf collection.`;
  const productCanonical=document.querySelector('#productCanonical');
  if(productCanonical)productCanonical.href=`${location.origin}${location.pathname}?id=${encodeURIComponent(String(product.id))}`;
  trackViewItem({currency:"USD",item:{item_id:String(product.sku||product.id),item_name:String(product.name||""),price:Number(product.price),quantity:1}});
  let qty=1;
  const safe=window.nutrileafEscapeHtml;
  const purchasable=window.nutrileafIsProductPurchasable(product);
  const image=product.image?`<img src="${safe(product.image)}" alt="${safe(product.name)}">`:`<div class="product-detail-symbol">${safe(product.symbol)}</div>`;
  detail.innerHTML=`<div class="product-detail-image">${image}</div><div><span class="product-detail-tag">${safe(product.type)}</span><h1>${safe(product.name)}</h1><p class="product-detail-description">${safe(product.desc)}${product.ingredients?`<br><br><strong>Ingredients:</strong> ${safe(product.ingredients)}`:""}</p><div class="product-detail-price">${window.nutrileafMoney(product.price)}</div><div class="detail-launch" aria-label="Online ordering status">Online ordering coming soon</div><div class="detail-note">Product information is available now while online ordering is being prepared.</div><div hidden aria-hidden="true"><input id="qtyValue" type="number" min="1" value="1" tabindex="-1"><button type="button" id="detailAdd" disabled aria-disabled="true" tabindex="-1">${purchasable?"Add to cart":product.availability==="SOLD_OUT"?"Sold out":"Unavailable"}</button></div></div>`;
  const qtyValue=document.querySelector("#qtyValue");
  const normalizeQty=()=>{const value=Math.max(1,parseInt(qtyValue.value,10)||1);qty=value;qtyValue.value=String(qty);return qty;};
  document.querySelector("#detailAdd").onclick=()=>{
    const amount=normalizeQty();
    if(!window.nutrileafAddToCart(product.id,amount))return;
    const dormantMessage=`${amount} × ${product.name} added to cart`;
    void dormantMessage;
  };
}
</script>
</body>
</html>
