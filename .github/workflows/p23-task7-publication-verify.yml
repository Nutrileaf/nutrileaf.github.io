name: P23 Task 7 Publication Verify

on:
  push:
    branches:
      - p23-task7-publication-verify
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Final storefront tests
        run: npm test
      - name: Final syntax checks
        run: |
          node --check script.js
          node --check p23-storefront-compat.js
          node --check checkout-state.js
          node --check checkout-submit.js
          node --check payment-initiation.js
          node --check order-status.js
          node --check confirmation.js
          node --check analytics.js
          node --check ga4-bootstrap.js
      - name: Published Pages HTTP verification
        shell: bash
        run: |
          set -euo pipefail
          nonce="${GITHUB_SHA}-${GITHUB_RUN_ID}"
          curl --silent --show-error --fail --location --retry 3 --retry-all-errors "https://nutrileaf.github.io/?p23verify=${nonce}" -o published-index.html
          curl --silent --show-error --fail --location --retry 3 --retry-all-errors "https://nutrileaf.github.io/script.js?p23verify=${nonce}" -o published-script.js
          curl --silent --show-error --fail --location --retry 3 --retry-all-errors "https://nutrileaf.github.io/p23-storefront-compat.js?p23verify=${nonce}" -o published-compat.js
          grep -Fq 'from "./p23-storefront-compat.js"' published-script.js
          grep -Fq 'product-unavailable' published-script.js
          grep -Fq 'Sold out' published-script.js
          grep -Fq 'normalizeProductAvailability' published-compat.js
          grep -Fq 'reconcileUnavailableCartItems' published-compat.js
          echo 'Published GitHub Pages storefront and Task 7 compatibility assets returned successfully.'
