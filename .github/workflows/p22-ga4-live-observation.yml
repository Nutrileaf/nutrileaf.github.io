name: P22 Published GA4 Ecommerce Observation

on:
  push:
    branches: [p22-ga4-live-observation-20260906]

permissions:
  contents: read

env:
  EXPECTED_MAIN: 7746c6398b20ba33c3acf6617486e365ab1814d0
  LIVE_SITE: https://nutrileaf.github.io
  PRODUCT_ID: 337365e0-ffb9-4913-a47b-ef776a873eb3
  MEASUREMENT_ID: G-8V7YT8ELZ2

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard published source identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git merge-base "$EXPECTED_MAIN" HEAD)" = "$EXPECTED_MAIN"
          test "$(git diff --name-only "$EXPECTED_MAIN" HEAD)" = ".github/workflows/p22-ga4-live-observation.yml"
          code=$(curl --silent --show-error --output /tmp/live.html --write-out '%{http_code}' "$LIVE_SITE/product.html?id=$PRODUCT_ID")
          test "$code" = 200
          grep -q 'ga4-bootstrap.js' /tmp/live.html
          grep -q 'trackViewItem' /tmp/live.html
      - name: Install isolated browser runtime
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Observe live ecommerce event transport
        shell: bash
        run: |
          set -euo pipefail
          node - <<'NODE'
          const { chromium } = require('playwright');
          const fs = require('fs');
          const site = process.env.LIVE_SITE;
          const productId = process.env.PRODUCT_ID;
          const measurementId = process.env.MEASUREMENT_ID;
          const observed=[];
          const accepted=[];
          function parseRequest(req){
            const url=req.url();
            if(!/(^|\.)google-analytics\.com$/.test(new URL(url).hostname)) return null;
            if(!new URL(url).pathname.endsWith('/g/collect')) return null;
            const u=new URL(url);
            const body=req.postData()||'';
            const params=new URLSearchParams(u.searchParams);
            for(const [k,v] of new URLSearchParams(body)) params.append(k,v);
            return {url,tid:params.get('tid'),en:params.get('en'),method:req.method()};
          }
          (async()=>{
            const browser=await chromium.launch({headless:true});
            const context=await browser.newContext({viewport:{width:1280,height:900}});
            const page=await context.newPage();
            page.on('request',req=>{try{const r=parseRequest(req);if(r){observed.push(r);console.log('GA_REQUEST='+JSON.stringify(r));}}catch{}});
            page.on('response',res=>{try{const r=parseRequest(res.request());if(r){accepted.push({...r,status:res.status()});console.log('GA_RESPONSE='+JSON.stringify({...r,status:res.status()}));}}catch{}});
            await page.goto(`${site}/product.html?id=${productId}`,{waitUntil:'domcontentloaded',timeout:90000});
            await page.waitForSelector('#detailAdd',{state:'visible',timeout:30000});
            await page.waitForTimeout(5000);
            const before=await page.evaluate(()=>({measurement:window.NUTRILEAF_GA4_MEASUREMENT_ID,dataLayer:(window.dataLayer||[]).map(x=>Array.from(x))}));
            if(before.measurement!==measurementId) throw new Error(`Measurement ID mismatch: ${before.measurement}`);
            const viewLayer=before.dataLayer.find(x=>x[0]==='event'&&x[1]==='view_item');
            if(!viewLayer) throw new Error('Published dataLayer did not contain view_item');
            await page.click('#detailAdd');
            await page.waitForTimeout(5000);
            const after=await page.evaluate(()=>({dataLayer:(window.dataLayer||[]).map(x=>Array.from(x)),toast:document.querySelector('#productToastMessage')?.textContent||''}));
            const addLayer=after.dataLayer.find(x=>x[0]==='event'&&x[1]==='add_to_cart');
            if(!addLayer) throw new Error('Published dataLayer did not contain add_to_cart');
            const ecommerce=['view_item','add_to_cart'];
            for(const name of ecommerce){
              const req=observed.find(x=>x.tid===measurementId&&x.en===name);
              if(!req) throw new Error(`No live GA collection request observed for ${name}`);
              const resp=accepted.find(x=>x.tid===measurementId&&x.en===name&&x.status>=200&&x.status<300);
              if(!resp) throw new Error(`No accepted GA collection response observed for ${name}`);
            }
            if(!after.toast.includes('added to cart')) throw new Error('Published add-to-cart interaction did not complete');
            const evidence={site,product_id:productId,measurement_id:measurementId,events:ecommerce.map(name=>({name,request:observed.find(x=>x.tid===measurementId&&x.en===name),response:accepted.find(x=>x.tid===measurementId&&x.en===name)})),data_layer_events:after.dataLayer.filter(x=>x[0]==='event').map(x=>x[1])};
            fs.writeFileSync('/tmp/ga4-evidence.json',JSON.stringify(evidence,null,2));
            console.log('P22_GA4_LIVE_OBSERVED='+JSON.stringify(evidence));
            await browser.close();
          })().catch(e=>{console.error(e);process.exit(1)});
          NODE
