name: P25 UI Cycle Verify Once

on:
  push:
    branches:
      - p25-product-operations-ux

permissions:
  contents: write

jobs:
  implement:
    if: "github.event.head_commit.message == 'ci(p25): apply unsaved detail guards'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply exact P25 unsaved-detail guards
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          p = Path('dashboard/app.js')
          text = p.read_text()

          replacements = [
            (
              '''function openEditor(product = null) {\n  const switchingProducts = !els.editor.hidden && (state.selected?.id ?? null) !== (product?.id ?? null);\n  if (switchingProducts && !confirmDiscardChanges()) return;''',
              '''function ensureNoUnsavedDetails(action) {\n  if (!editorIsDirty()) return true;\n  showEditorMessage(`Save or Cancel your product detail changes before ${action}.`, "error");\n  return false;\n}\n\nfunction openEditor(product = null) {\n  if (!els.editor.hidden && editorIsDirty() && !confirmDiscardChanges()) return;'''
            ),
            (
              '''async function changeVisibility(visible) {\n  if (!state.selected) return;''',
              '''async function changeVisibility(visible) {\n  if (!state.selected) return;\n  if (!ensureNoUnsavedDetails("changing store visibility")) return;'''
            ),
            (
              '''async function adjustStock(operation) {\n  if (!state.selected) return;''',
              '''async function adjustStock(operation) {\n  if (!state.selected) return;\n  if (!ensureNoUnsavedDetails("adjusting stock")) return;'''
            ),
            (
              '''async function uploadPhoto() {\n  if (!state.selected) return;''',
              '''async function uploadPhoto() {\n  if (!state.selected) return;\n  if (!ensureNoUnsavedDetails("saving a product photo")) return;'''
            ),
            (
              '''async function removePhoto() {\n  if (!state.selected || !state.selected.photo) return;''',
              '''async function removePhoto() {\n  if (!state.selected || !state.selected.photo) return;\n  if (!ensureNoUnsavedDetails("removing the product photo")) return;'''
            ),
            (
              '''    if (!file) {\n      revokeObjectUrl("editPhotoPreviewUrl");\n      populateEditor(state.selected);\n      return;\n    }''',
              '''    if (!file) {\n      revokeObjectUrl("editPhotoPreviewUrl");\n      els.photoSelectionStatus.textContent = "";\n      if (state.selected?.photo) {\n        els.photoPreview.src = `/media/products/${encodeURIComponent(state.selected.id)}`;\n        els.photoPreview.alt = `${state.selected.name} current product photo`;\n        els.photoPreview.hidden = false;\n      } else {\n        els.photoPreview.removeAttribute("src");\n        els.photoPreview.hidden = true;\n      }\n      return;\n    }'''
            )
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'exact patch marker mismatch: expected 1, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          p.write_text(text)
          PY
      - name: Verify GREEN
        run: |
          node --test tests/p25-dashboard-ux.test.mjs
          npm test
          node --check dashboard/app.js
          node --check dashboard/model.js
      - name: Commit guarded implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Nutrileaf P25 Automation"
          git config user.email "actions@users.noreply.github.com"
          git add dashboard/app.js
          git diff --cached --quiet && { echo "No implementation change staged"; exit 1; }
          git commit -m "fix(p25): preserve unsaved details during operator actions"
          git push origin HEAD:p25-product-operations-ux
