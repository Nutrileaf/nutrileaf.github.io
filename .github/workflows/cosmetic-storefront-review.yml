name: Cosmetic Storefront Review Verify

on:
  push:
    branches:
      - cosmetic-usability-review-storefront
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Full storefront regression suite
        run: npm test

      - name: JavaScript syntax
        run: |
          node --check script.js
          node --check p27-catalog-launch.js
          node --check post-publication-polish.js
          node --check p23-storefront-compat.js

      - name: Review boundary scan
        shell: bash
        run: |
          set -euo pipefail
          test ! -e dashboard
          grep -q 'cosmetic-review.css' index.html
          grep -q 'cosmetic-review.css' product.html
          ! grep -niE 'NUTRILEAF_(PROD_)?ADMIN_TOKEN|STRIPE_SECRET|PAYPAL_CLIENT_SECRET|EASYPOST' -- index.html product.html cosmetic-review.css
          grep -q 'id="cartButton" hidden aria-hidden="true"' index.html

      - name: Install isolated screenshot runtime
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Capture synthetic review previews
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/nutrileaf-preview-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          node tests/capture-storefront-preview.mjs

      - name: Upload sanitized review previews
        uses: actions/upload-artifact@v4
        with:
          name: cosmetic-storefront-review-${{ github.run_id }}
          path: artifacts/cosmetic-storefront/*.png
          retention-days: 14
