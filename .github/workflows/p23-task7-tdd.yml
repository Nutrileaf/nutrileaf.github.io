name: P23 Task 7 TDD

on:
  push:
    branches:
      - p23-product-catalog-compat
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Storefront tests
        run: npm test
      - name: Syntax checks
        run: |
          node --check script.js
          node --check p23-storefront-compat.js
          node --check checkout-state.js
          node --check checkout-submit.js
          node --check payment-initiation.js
          node --check order-status.js
          node --check confirmation.js
          node --check analytics.js
          node --check ga4-bootstrap.js
      - name: Static publication contract
        shell: bash
        run: |
          set -euo pipefail
          test -f index.html
          test -f product.html
          test -f script.js
          test -f p23-storefront-compat.js
          grep -Fq 'type="module" src="script.js"' product.html
          grep -Fq 'from "./p23-storefront-compat.js"' script.js
          grep -Fq 'availability' script.js
          grep -Fq 'product-unavailable' script.js
          git diff --check
      - name: Browser secret and admin boundary scan
        shell: bash
        run: |
          set -euo pipefail
          files='index.html product.html script.js p23-storefront-compat.js checkout-state.js checkout-submit.js payment-initiation.js order-status.js confirmation.js analytics.js ga4-bootstrap.js'
          if grep -En 'NUTRILEAF_TEST_ADMIN_TOKEN|CLOUDFLARE_API_TOKEN|CLOUDFLARE_WORKER_READ_TOKEN|STRIPE_SECRET|PAYPAL_CLIENT_SECRET|/admin/products' $files; then
            echo 'Privileged credential/admin material found in browser source.' >&2
            exit 1
          fi
