name: P34 Storefront TEST Shipping Verify

on:
  push:
    branches:
      - p34-easypost-test-implementation
  pull_request:
    branches:
      - development
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          for file in dashboard/*.js; do node --check "$file"; done
