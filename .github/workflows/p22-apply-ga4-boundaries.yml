name: P22 Apply GA4 Boundaries

on:
  push:
    branches: [p22-ga4-analytics-20260906]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: p22-ga4-analytics-20260906
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply verified GA4 event boundaries
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          bootstrap = '<script type="module" src="ga4-bootstrap.js"></script>'
          old_tag = '''<!-- Google tag (gtag.js) -->
          <script async src="https://www.googletagmanager.com/gtag/js?id=G-8V7YT8ELZ2"></script>
          <script>
            window.dataLayer = window.dataLayer || [];
            function gtag(){dataLayer.push(arguments);}
            gtag('js', new Date());
            gtag('config', 'G-8V7YT8ELZ2');
          </script>
          '''
          for name in ['index.html', 'product.html']:
              path = Path(name)
              text = path.read_text()
              if old_tag not in text:
                  raise SystemExit(f'{name}: existing GA4 tag block marker missing')
              path.write_text(text.replace(old_tag, bootstrap + '\n', 1))

          path = Path('confirmation.html')
          text = path.read_text()
          marker = '<head>\n'
          if bootstrap not in text:
              if marker not in text: raise SystemExit('confirmation head marker missing')
              text = text.replace(marker, marker + '  ' + bootstrap + '\n', 1)
          path.write_text(text)

          path = Path('script.js')
          text = path.read_text()
          import_marker = 'import { submitPaymentInitiation } from "./payment-initiation.js";'
          analytics_import = 'import { trackAddToCart, trackBeginCheckout } from "./analytics.js";'
          if analytics_import not in text:
              if import_marker not in text: raise SystemExit('script import marker missing')
              text = text.replace(import_marker, import_marker + '\n' + analytics_import, 1)

          old_add = 'function addToCart(id,quantity=1){const p=products.find(x=>String(x.id)===String(id));if(!p)return;const item=cart.find(x=>x.product_id===String(id));item?item.quantity+=quantity:cart.push({product_id:String(id),quantity});save();toast(`${quantity} × ${p.name} added to cart`)}'
          new_add = 'function analyticsItem(p,quantity=1){return {item_id:String(p.sku||p.id),item_name:String(p.name||""),price:Number(p.price),quantity}}\nfunction addToCart(id,quantity=1){const p=products.find(x=>String(x.id)===String(id));if(!p)return;const item=cart.find(x=>x.product_id===String(id));item?item.quantity+=quantity:cart.push({product_id:String(id),quantity});trackAddToCart({currency:"USD",item:analyticsItem(p,quantity)});save();toast(`${quantity} × ${p.name} added to cart`)}'
          if old_add not in text: raise SystemExit('addToCart marker missing')
          text = text.replace(old_add, new_add, 1)

          order_marker = '   const order=result.payload?.order||{};\n'
          begin_block = '''   const order=result.payload?.order||{};
             const items=cart.map(x=>{const product=products.find(p=>String(p.id)===x.product_id);return product?analyticsItem(product,x.quantity):null}).filter(Boolean);
             trackBeginCheckout({currency:String(order.currency||"USD"),value:Number(order.total||0)/100,items});
          '''
          if order_marker not in text: raise SystemExit('checkout confirm marker missing')
          text = text.replace(order_marker, begin_block, 1)
          path.write_text(text)

          path = Path('product.html')
          text = path.read_text()
          inline_marker = '<script type="module">\nawait window.nutrileafCatalogReady;'
          inline_new = '<script type="module">\nimport { trackViewItem } from "./analytics.js";\nawait window.nutrileafCatalogReady;'
          if inline_marker not in text: raise SystemExit('product inline module marker missing')
          text = text.replace(inline_marker, inline_new, 1)
          detail_marker = '''}else{
            let qty=1;'''
          detail_new = '''}else{
            trackViewItem({currency:"USD",item:{item_id:String(product.sku||product.id),item_name:String(product.name||""),price:Number(product.price),quantity:1}});
            let qty=1;'''
          if detail_marker not in text: raise SystemExit('product detail marker missing')
          text = text.replace(detail_marker, detail_new, 1)
          path.write_text(text)

          path = Path('confirmation.js')
          text = path.read_text()
          status_import = 'import { getOrderStatus } from "./order-status.js";'
          purchase_import = 'import { trackPurchase } from "./analytics.js";'
          if purchase_import not in text:
              if status_import not in text: raise SystemExit('confirmation import marker missing')
              text = text.replace(status_import, status_import + '\n' + purchase_import, 1)
          render_marker = '      render(`${order.number}: ${order.message}`, "success");'
          if render_marker not in text: raise SystemExit('confirmation paid boundary marker missing')
          text = text.replace(render_marker, render_marker + '\n      if (order.analytics) trackPurchase(order.analytics);', 1)
          path.write_text(text)

          Path('.github/workflows/p22-apply-ga4-boundaries.yml').unlink()
          PY
          npm test
          node --check script.js
          node --check checkout-state.js
          node --check checkout-submit.js
          node --check payment-initiation.js
          node --check order-status.js
          node --check confirmation.js
          node --check analytics.js
          node --check ga4-bootstrap.js
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: wire authoritative GA4 ecommerce events"
          git push origin HEAD:p22-ga4-analytics-20260906
